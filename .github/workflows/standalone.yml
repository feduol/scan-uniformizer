name: Build standalone applications

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Append standalone downloads to the existing release (keeps the Python ZIP)
        type: boolean
        default: false
      python_only:
        description: Package only the Python source ZIP (skip standalone builds)
        type: boolean
        default: false
      release_tag:
        description: Existing release tag to receive the additional downloads
        type: string
        default: v1.0.1

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.platform }}
    if: ${{ !inputs.python_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-Apple-Silicon
          - os: macos-15-intel
            platform: macOS-Intel
          - os: windows-2022
            platform: Windows-x64
          - os: ubuntu-22.04
            platform: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth tcl8.6 tk8.6
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test original Python program
        run: python -m unittest discover -s tests -v
      - name: Build and test standalone app
        if: runner.os != 'Linux'
        run: python build_standalone.py
      - name: Build and test Linux app with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python build_standalone.py
      - name: Save standalone downloads
        uses: actions/upload-artifact@v4
        with:
          name: Scan-Uniformizer-${{ matrix.platform }}
          path: dist-standalone/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Add downloads without replacing existing assets
    if: ${{ always() && inputs.publish && (needs.build.result == 'success' || (inputs.python_only && needs.build.result == 'skipped')) }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: inputs.python_only
      - name: Package Python source
        if: inputs.python_only
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, os, re, zipfile
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected a version tag'
          files = ['.gitignore', 'LICENSE', 'READ ME.txt', 'README.md',
                   'Start Scan Uniformizer.command', 'requirements.txt', 'scan_uniformizer.py',
                   'tests/test_uniformizer.py', 'scan-uniformizer.png', 'STANDALONE.md',
                   'standalone_entry.py', 'standalone_smoke.py', 'build_standalone.py',
                   'requirements-build.txt', 'TCL-TK-LICENSES.txt']
          Path('downloads').mkdir(exist_ok=True)
          archive = Path('downloads') / f'Scan-Uniformizer-{tag}.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  z.write(name, 'Scan Uniformizer/' + name)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert z.read('Scan Uniformizer/scan_uniformizer.py') == Path('scan_uniformizer.py').read_bytes()
              assert z.read('Scan Uniformizer/scan-uniformizer.png') == Path('scan-uniformizer.png').read_bytes()
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix('.zip.sha256').write_text(f'{digest}  {archive.name}\n')
          print(f'Verified Python package: {archive.name}')
          PYTHON
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.python_only }}
        with:
          path: downloads
          merge-multiple: true
      - name: Append assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" downloads/* --repo "$GITHUB_REPOSITORY"
