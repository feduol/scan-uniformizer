name: Build standalone applications

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Append standalone downloads to the existing release (keeps the Python ZIP)
        type: boolean
        default: false
      release_tag:
        description: Existing release tag to receive the additional downloads
        type: string
        default: v1.0.0

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-Apple-Silicon
          - os: macos-15-intel
            platform: macOS-Intel
          - os: windows-2022
            platform: Windows-x64
          - os: ubuntu-22.04
            platform: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth tcl8.6 tk8.6
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test original Python program
        run: python -m unittest discover -s tests -v
      - name: Build and test standalone app
        if: runner.os != 'Linux'
        run: python build_standalone.py
      - name: Build and test Linux app with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python build_standalone.py
      - name: Save standalone downloads
        uses: actions/upload-artifact@v4
        with:
          name: Scan-Uniformizer-${{ matrix.platform }}
          path: dist-standalone/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Add downloads without replacing the Python release
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Append assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" downloads/* --repo "$GITHUB_REPOSITORY"
